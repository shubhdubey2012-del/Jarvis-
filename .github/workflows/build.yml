name: Build Jarvis
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create Jarvis project files
        run: |
          set -e
          mkdir -p jarvis
          cd jarvis
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.jarvis.assistant"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.jarvis.assistant"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'JARVIS_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <application android:label="Jarvis" android:theme="@style/Theme.Jarvis">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".VoiceService" android:foregroundServiceType="microphone" android:exported="false"/>
                  <service android:name=".JarvisAccessibility" android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/assistant/JarvisAccessibility.kt)
          cat > app/src/main/java/com/jarvis/assistant/JarvisAccessibility.kt <<'JARVIS_EOF'
          package com.jarvis.assistant

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo as Node

          class JarvisAccessibility : AccessibilityService() {
              companion object { var instance: JarvisAccessibility? = null }

              override fun onServiceConnected() { instance = this }
              override fun onUnbind(i: Intent?): Boolean { instance = null; return super.onUnbind(i) }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun run(cmd: String): String {
                  val c = cmd.lowercase().trim()
                  return when {
                      c.startsWith("open ") -> openApp(c.removePrefix("open ").trim())
                      c.startsWith("click ") || c.startsWith("tap ") -> click(c.substringAfter(" "))
                      c.startsWith("type ") -> type(c.removePrefix("type "))
                      c == "go back" || c == "back" -> g(GLOBAL_ACTION_BACK, "Going back")
                      c == "go home" || c == "home" -> g(GLOBAL_ACTION_HOME, "Home")
                      c.contains("recent") -> g(GLOBAL_ACTION_RECENTS, "Recent apps")
                      c.contains("notification") -> g(GLOBAL_ACTION_NOTIFICATIONS, "Notifications")
                      c.contains("screenshot") -> g(GLOBAL_ACTION_TAKE_SCREENSHOT, "Screenshot taken")
                      c.contains("lock screen") || c == "lock" || c == "lock phone" -> g(GLOBAL_ACTION_LOCK_SCREEN, "Locking")
                      c.startsWith("scroll down") -> scroll(Node.ACTION_SCROLL_FORWARD)
                      c.startsWith("scroll up") -> scroll(Node.ACTION_SCROLL_BACKWARD)
                      else -> "Sorry, I don't know how to do that yet"
                  }
              }

              private fun g(action: Int, msg: String): String { performGlobalAction(action); return msg }

              private fun openApp(name: String): String {
                  val pm = packageManager
                  val pkg = pm.getInstalledApplications(0).firstOrNull {
                      pm.getLaunchIntentForPackage(it.packageName) != null &&
                          pm.getApplicationLabel(it).toString().lowercase().contains(name)
                  }?.packageName ?: return "I can't find $name"
                  startActivity(pm.getLaunchIntentForPackage(pkg)!!.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  return "Opening $name"
              }

              private fun click(text: String): String {
                  val n = rootInActiveWindow?.findAccessibilityNodeInfosByText(text)?.firstOrNull()
                      ?: return "I can't see $text on screen"
                  var x: Node? = n
                  while (x != null && !x.isClickable) x = x.parent
                  (x ?: n).performAction(Node.ACTION_CLICK)
                  return "Tapped $text"
              }

              private fun findScrollable(n: Node?): Node? {
                  if (n == null) return null
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) {
                      val r = findScrollable(n.getChild(i))
                      if (r != null) return r
                  }
                  return null
              }

              private fun scroll(dir: Int): String {
                  val s = findScrollable(rootInActiveWindow) ?: return "Nothing to scroll"
                  s.performAction(dir)
                  return "Scrolling"
              }

              private fun type(text: String): String {
                  val f = rootInActiveWindow?.findFocus(Node.FOCUS_INPUT) ?: return "Tap a text box first"
                  val b = Bundle().apply { putCharSequence(Node.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text) }
                  f.performAction(Node.ACTION_SET_TEXT, b)
                  return "Typed"
              }
          }
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/assistant/MainActivity.kt)
          cat > app/src/main/java/com/jarvis/assistant/MainActivity.kt <<'JARVIS_EOF'
          package com.jarvis.assistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val a = this
                  val l = LinearLayout(a).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 96, 48, 48) }
                  l.addView(Button(a).apply {
                      text = "1. Allow microphone"
                      setOnClickListener {
                          ActivityCompat.requestPermissions(a,
                              arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS), 1)
                      }
                  })
                  l.addView(Button(a).apply {
                      text = "2. Enable Jarvis accessibility"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })
                  l.addView(Button(a).apply {
                      text = "3. Start listening"
                      setOnClickListener {
                          if (ContextCompat.checkSelfPermission(a, Manifest.permission.RECORD_AUDIO) ==
                              PackageManager.PERMISSION_GRANTED) {
                              ContextCompat.startForegroundService(a, Intent(a, VoiceService::class.java))
                          } else Toast.makeText(a, "Do step 1 first", Toast.LENGTH_LONG).show()
                      }
                  })
                  setContentView(l)
              }
          }
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/java/com/jarvis/assistant/VoiceService.kt)
          cat > app/src/main/java/com/jarvis/assistant/VoiceService.kt <<'JARVIS_EOF'
          package com.jarvis.assistant

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat

          class VoiceService : Service(), RecognitionListener {
              private lateinit var sr: SpeechRecognizer
              private lateinit var tts: TextToSpeech
              private val h = Handler(Looper.getMainLooper())

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("j", "Jarvis", NotificationManager.IMPORTANCE_LOW))
                  val n = NotificationCompat.Builder(this, "j").setContentTitle("Jarvis is listening")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                  ServiceCompat.startForeground(this, 1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  tts = TextToSpeech(this) {}
                  sr = SpeechRecognizer.createSpeechRecognizer(this)
                  sr.setRecognitionListener(this)
                  listen()
              }

              private fun listen() {
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  sr.startListening(i)
              }

              override fun onResults(r: Bundle?) {
                  val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.lowercase() ?: ""
                  if (t.startsWith("jarvis")) {
                      val cmd = t.removePrefix("jarvis").trim(' ', ',')
                      val reply = JarvisAccessibility.instance?.run(cmd) ?: "Please enable the Jarvis accessibility service"
                      tts.speak(reply, TextToSpeech.QUEUE_FLUSH, null, "j")
                  }
                  h.postDelayed({ listen() }, 300)
              }

              override fun onError(e: Int) { h.postDelayed({ listen() }, 600) }
              override fun onDestroy() { h.removeCallbacksAndMessages(null); sr.destroy(); tts.shutdown(); super.onDestroy() }
              override fun onReadyForSpeech(p: Bundle?) {}
              override fun onBeginningOfSpeech() {}
              override fun onRmsChanged(v: Float) {}
              override fun onBufferReceived(b: ByteArray?) {}
              override fun onEndOfSpeech() {}
              override fun onPartialResults(p: Bundle?) {}
              override fun onEvent(t: Int, p: Bundle?) {}
          }
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'JARVIS_EOF'
          <resources><string name="app_name">Jarvis</string></resources>
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/res/values/themes.xml)
          cat > app/src/main/res/values/themes.xml <<'JARVIS_EOF'
          <resources><style name="Theme.Jarvis" parent="Theme.AppCompat.DayNight.DarkActionBar"/></resources>
          JARVIS_EOF
          mkdir -p $(dirname app/src/main/res/xml/accessibility_config.xml)
          cat > app/src/main/res/xml/accessibility_config.xml <<'JARVIS_EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagIncludeNotImportantViews"
              android:description="@string/app_name"
              android:notificationTimeout="100"/>
          JARVIS_EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'JARVIS_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          JARVIS_EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'JARVIS_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          JARVIS_EOF
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'JARVIS_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Jarvis"
          include(":app")
          JARVIS_EOF

      - name: Build APK
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-${{ github.run_number }}
          name: Jarvis build ${{ github.run_number }}
          files: jarvis/app/build/outputs/apk/debug/app-debug.apk
